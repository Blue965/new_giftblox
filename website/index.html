<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GiftBlox</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
*{font-family:'Rajdhani',sans-serif;letter-spacing:-.02em}h1{font-family:'Orbitron',sans-serif}

/* Animated Background */
body{
  background:#0a0a0f;
  color:#fff;
  overflow-x:hidden;
  position:relative;
  min-height:100vh
}

body::before{
  content:'';
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(139,92,246,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(236,72,153,0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(139,92,246,0.05) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
  animation:bgPulse 8s ease-in-out infinite
}

@keyframes bgPulse{
  0%,100%{opacity:1}
  50%{opacity:0.7}
}

/* Floating Particles */
.particles{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  pointer-events:none;
  z-index:1;
  overflow:hidden
}

.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:rgba(139,92,246,0.3);
  border-radius:50%;
  animation:float 15s infinite
}

@keyframes float{
  0%,100%{transform:translateY(100vh) rotate(0deg);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-100vh) rotate(720deg);opacity:0}
}

.glow{
  text-shadow:0 0 20px rgba(139,92,246,.3),0 0 40px rgba(139,92,246,.2)
}

.glass{
  background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(24px);
  transition:all .4s cubic-bezier(.175,.885,.32,1.275)
}

.glass:hover{
  border-color:rgba(139,92,246,.25);
  transform:translateY(-4px);
  box-shadow:0 12px 50px rgba(139,92,246,.2)
}

.btn-primary{
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  transition:all .3s;
  position:relative;
  overflow:hidden
}

.btn-primary::before{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition:left 0.5s
}

.btn-primary:hover::before{
  left:100%
}

.btn-primary:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px rgba(139,92,246,.4)
}

/* Feature cards animation */
.feature-card{
  animation:fadeInUp 0.6s ease-out forwards;
  opacity:0
}

.feature-card:nth-child(1){animation-delay:0.1s}
.feature-card:nth-child(2){animation-delay:0.2s}
.feature-card:nth-child(3){animation-delay:0.3s}

@keyframes fadeInUp{
  from{
    opacity:0;
    transform:translateY(30px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}

/* Hero animation */
.hero-content{
  animation:heroFadeIn 1s ease-out
}

@keyframes heroFadeIn{
  from{
    opacity:0;
    transform:translateY(20px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}
</style>
</head>
<body>
<!-- Floating Particles -->
<div class="particles" id="particles"></div>

<nav class="fixed top-0 w-full z-50 glass">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center shadow-lg shadow-violet-600/20"><span class="text-white font-black text-sm">G</span></div>
      <span class="font-black text-lg tracking-tighter">GiftBlox <span class="text-[10px] font-semibold text-violet-400 ml-1">PREMIUM</span></span>
    </div>
    <div class="hidden md:flex items-center space-x-8 text-sm font-bold uppercase tracking-widest">
      <a href="#features" class="hover:text-purple-400 transition">Fonctionnalités</a>
      <a href="#how-it-works" class="hover:text-purple-400 transition">Processus</a>
    </div>
    <button onclick="login()" class="btn-primary px-6 py-2.5 rounded-full text-xs font-black uppercase tracking-tighter"><i class="fab fa-discord mr-2"></i>Connexion</button>
  </div>
</nav>

<section class="relative pt-48 pb-32 min-h-screen flex items-center justify-center">
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-violet-600/20 rounded-full blur-[120px] -z-10"></div>
  <div class="hero-content text-center max-w-3xl mx-auto px-6 relative z-10">
    <h1 class="text-6xl md:text-8xl font-black tracking-tighter glow mb-6">GIFT<span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-500">BLOX</span></h1>
    <p class="text-gray-400 text-lg md:text-xl font-medium mb-10">L'écosystème de fidélité Discord n°1 avec expérience premium</p>
    <button onclick="login()" class="btn-primary px-10 py-4 rounded-full text-sm font-black uppercase tracking-widest"><i class="fab fa-discord mr-3"></i>Connexion avec Discord</button>
  </div>
</section>

<section id="features" class="py-32 px-6 relative z-10">
  <div class="max-w-7xl mx-auto">
    <h2 class="text-4xl font-black text-center mb-16">Pourquoi <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-fuchsia-500">GiftBlox</span> ?</h2>
    <div class="grid md:grid-cols-3 gap-8">
      <div class="feature-card glass rounded-3xl p-8 text-center"><div class="w-16 h-16 rounded-2xl bg-violet-600/20 flex items-center justify-center mx-auto mb-6"><i class="fas fa-bolt text-2xl text-violet-400"></i></div><h3 class="font-black text-lg mb-3">Performance</h3><p class="text-gray-400 font-medium">Bot ultra-rapide avec 0 latence</p></div>
      <div class="feature-card glass rounded-3xl p-8 text-center"><div class="w-16 h-16 rounded-2xl bg-fuchsia-600/20 flex items-center justify-center mx-auto mb-6"><i class="fas fa-shield text-2xl text-fuchsia-400"></i></div><h3 class="font-black text-lg mb-3">Sécurité</h3><p class="text-gray-400 font-medium">Données chiffrées et sécurisées</p></div>
      <div class="feature-card glass rounded-3xl p-8 text-center"><div class="w-16 h-16 rounded-2xl bg-violet-600/20 flex items-center justify-center mx-auto mb-6"><i class="fas fa-crown text-2xl text-violet-400"></i></div><h3 class="font-black text-lg mb-3">Premium</h3><p class="text-gray-400 font-medium">Dashboard complet avec analytics</p></div>
    </div>
  </div>
</section>

<script>
const CLIENT_ID = '1513281082626281472';
const REDIRECT = 'https://new-giftblox.vercel.app/callback.html';

// Create floating particles
function createParticles() {
  const container = document.getElementById('particles');
  if (!container) return;
  
  for (let i = 0; i < 30; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 15 + 's';
    particle.style.animationDuration = (15 + Math.random() * 10) + 's';
    particle.style.width = (2 + Math.random() * 4) + 'px';
    particle.style.height = particle.style.width;
    particle.style.opacity = 0.2 + Math.random() * 0.3;
    container.appendChild(particle);
  }
}

function login(){
  let p = new URLSearchParams({client_id:CLIENT_ID,redirect_uri:REDIRECT,response_type:'token',scope:'identify email'});
  window.location.href = 'https://discord.com/api/oauth2/authorize?' + p.toString();
}

// Redirect if already logged in
let u = localStorage.getItem('discord_user');
if(u) window.location.href = 'dashboard.html';

// Initialize particles on load
document.addEventListener('DOMContentLoaded', createParticles);
</script>
</body>
</html>
