<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Authentification | GiftBlox</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="giftblox.css">
<style>
body{overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:#fff;border:3px solid #2b2440;border-radius:28px;box-shadow:12px 14px 0 #2b2440;padding:2.5rem;max-width:380px;width:100%;text-align:center}
.loader{position:relative;width:88px;height:88px;margin:0 auto 1.5rem}
.loader__box{position:absolute;inset:0;border:3px solid #2b2440;border-radius:24px;background:linear-gradient(180deg,#9a72ff,#7a4ff2);box-shadow:0 5px 0 #2b2440;animation:bounce 1.1s cubic-bezier(.45,0,.55,1) infinite}
.loader__box::after{content:'G';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:34px;font-weight:700;color:#fff}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(-8deg)}}
.bar{width:100%;height:16px;background:#e9e2f5;border:2.5px solid #2b2440;border-radius:999px;overflow:hidden}
.fill{width:0%;height:100%;background:linear-gradient(90deg,#7a4ff2,#ff5c9d);transition:width .5s cubic-bezier(.34,1.56,.64,1)}
</style>
</head>
<body>

<div class="auth-card">
  <div class="loader"><div class="loader__box"></div></div>
  <h1 class="text-2xl font-black mb-2" style="font-family:'Fredoka'">Connexion en cours</h1>
  <p id="status" class="text-xs font-extrabold uppercase tracking-widest mb-4" style="color:#8b83a3">Liaison avec Discord</p>
  <div class="bar"><div id="progress" class="fill"></div></div>
  <p class="text-xs font-bold mt-4" style="color:#a89fc0">GiftBlox</p>
</div>

<script>
const statusText = document.getElementById('status');
const progress = document.getElementById('progress');
function setStatus(s,p){ statusText.textContent = s; progress.style.width = p + '%'; }

const fragment = new URLSearchParams(window.location.hash.slice(1));
const accessToken = fragment.get('access_token');
const error = new URLSearchParams(window.location.search).get('error') || fragment.get('error');

if (error) {
  setStatus('Échec de la connexion', 100);
  setTimeout(() => { window.location.href = 'index.html'; }, 1200);
} else if (accessToken) {
  setStatus('Récupération du profil', 40);
  fetch('https://discord.com/api/users/@me', { headers: { Authorization: 'Bearer '+accessToken } })
  .then(r => { if(!r.ok) throw new Error('discord'); return r.json(); })
  .then(userData => {
    setStatus('Synchronisation', 70);
    localStorage.setItem('discord_token', accessToken);
    localStorage.setItem('discord_user', JSON.stringify(userData));
    setStatus('Accès validé', 100);
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
  })
  .catch(() => { window.location.href = 'index.html?error=fetch'; });
} else {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
