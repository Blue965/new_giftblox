services:
  giftblox:
    build: .
    image: giftblox:local
    container_name: giftblox
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      TZ: Europe/Paris
      # La base vit dans le volume, pas dans l'image
      DB_PATH: /app/data/giftblox.db
      API_PORT: 3001
      PORT: 3001

    ports:
      # 3001 exposé sur le PC pour ngrok / le dashboard
      - "3001:3001"

    volumes:
      # Persistance de giftblox.db : le volume survit à la recréation
      - giftblox-data:/app/data

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/global-stats',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  giftblox-data: